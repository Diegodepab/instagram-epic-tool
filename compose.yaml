services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    environment:
      ENABLE_INSTAGRAPI_LAB: ${ENABLE_INSTAGRAPI_LAB:-false}
      IG_PROXY: ${IG_PROXY:-}
      LIVE_SCAN_FOLLOWERS_LIMIT: ${LIVE_SCAN_FOLLOWERS_LIMIT:-200}
      LIVE_SCAN_FOLLOWING_LIMIT: ${LIVE_SCAN_FOLLOWING_LIMIT:-200}
      LIVE_SCAN_PROFILE_PICS_LIMIT: ${LIVE_SCAN_PROFILE_PICS_LIMIT:-50}
      LIVE_SCAN_COOLDOWN_SECONDS: ${LIVE_SCAN_COOLDOWN_SECONDS:-120}
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
